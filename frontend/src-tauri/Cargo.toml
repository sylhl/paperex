[package]
name = "paperex"
version = "1.2.0"
description = "paperex — 本地优先的学术论文原位重排双语阅读器"
license = "AGPL-3.0-or-later"
authors = ["paperex"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "paperex_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 生产构建必须启用该 feature（把 dist 打进二进制）；
# 缺少它时 tauri 会认为处于 dev 模式，改用 devUrl（127.0.0.1:1420）加载前端。
# 不要设为默认 feature，否则 `tauri dev` 的热更新会失效。
[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
