name: 功能建议
description: 提出新功能或改进建议（不是缺陷报告）
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        请先搜索现有 issue。描述越具体（场景、期望行为、替代方案），越容易被采纳。
        路线图见 [docs/ROADMAP.md](https://github.com/)（仓库内 `docs/ROADMAP.md`）。

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过现有 issue，没有重复
          required: true
        - label: 这不是安全漏洞（安全漏洞请走 SECURITY.md）
          required: true

  - type: textarea
    id: problem
    attributes:
      label: 使用场景与问题
      description: 你正在做什么？现有功能哪里不够用？
      placeholder: "例如：翻译 80 页的双栏论文时，strict 模式耗时过长…"
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
      description: 你希望 paperex 如何表现？
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 你目前如何绕过这个问题？
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: 涉及区域
      options:
        - 翻译质量与引擎
        - QA 与质量循环
        - 前端界面与阅读器
        - 性能与任务调度
        - 缓存与术语库
        - 桌面壳 / 打包 / 跨平台
        - 文档
        - 其他
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: 对你的重要程度
      options:
        - 有更好，没有也能用
        - 比较影响日常使用
        - 阻断我的工作流
    validations:
      required: false

  - type: checkboxes
    id: contribute
    attributes:
      label: 贡献意愿
      options:
        - label: 我愿意参与实现或测试这个功能
          required: false

  - type: textarea
    id: extra
    attributes:
      label: 其他信息
      description: 参考实现、论文/版式样例（可脱敏）、截图等
    validations:
      required: false
